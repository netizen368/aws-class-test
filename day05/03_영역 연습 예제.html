<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>영역 연습 예제</title>
	<style>
		/*연습
		.container1{padding: 1px; border: 5px solid red;}
		.container1 > .box1{box-sizing: border-box; padding: 50px; border: 5px solid black; margin: 20px;}

		.container2{width: 150px; height: 150px; border: 5px solid red;}
		.container2 > .box2{box-sizing: border-box; width: 100px; height: 100px; border: 5px solid black; margin: 20px;}
		*/
		/*정답*/
		.container1{
			border: 5px solid red; width: 150px; height: 150px;
		}
		.box1{
			border: 5px solid black; width: 100px; height: 100px;
			margin: 20px;
		}

		.container2{
			border: 5px solid red; width: 110px; height: 110px;
			padding: 20px;
		}
		.box2{
			border: 5px solid black; width: 100px; height: 100px;
		}
	</style>
</head>
<body>
	<!-- 
	테두리: 5px
	검은 테두리와 빨간 테두리 사이의 여백 20px
	검은 박스 컨텐츠 너비는 100px
	빨간 박스 컨텐츠 너비는 150px
	-->
	<h1>margin을 이용</h1>
	<div class="container1">
		<div class="box1"></div>
	</div>
	<hr>
	<h1>padding을 이용</h1>
	<div class="container2">
		<div class="box2"></div>
	</div>
</body>
</html>
